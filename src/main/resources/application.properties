server.port=8081
tournament.data-dir=./data
# Thread pool for concurrent game execution (increase for network players with I/O wait)
tournament.game-thread-pool-size=64
# Per-decision timeout and per-game budget (0 = disabled)
# tournament.per-call-timeout-seconds=5
# tournament.game-budget-seconds=30
# Engine defaults (populated by env vars in Docker, empty for local dev)
tournament.engine-jar=${TOURNAMENT_ENGINE_JAR:}
tournament.engine-class=${TOURNAMENT_ENGINE_CLASS:}
